version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: zendrox_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zendrox_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Zendrox_UltraSecret_2026!}
      POSTGRES_DB: ${POSTGRES_DB:-zendroxtech_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./live_db_backup.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zendrox_user} -d ${POSTGRES_DB:-zendroxtech_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - zendrox_net

  backend:
    build:
      context: ./backend
    container_name: zendrox_api
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zendrox_user}:${POSTGRES_PASSWORD:-Zendrox_UltraSecret_2026!}@db:5432/${POSTGRES_DB:-zendroxtech_db}
      UPLOAD_DIR: /uploads/laptops
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://host.docker.internal:5678/webhook/notas-entrega}
    volumes:
      - ./uploads/laptops:/uploads/laptops
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zendrox_net

  web:
    build:
      context: ./frontend
    container_name: zendrox_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./zendroxtech_e_commerce_store.html:/usr/share/nginx/html/index.html:ro
      - ./uploads/laptops:/uploads/laptops:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - zendrox_net

volumes:
  postgres_data:

networks:
  zendrox_net:
    driver: bridge
