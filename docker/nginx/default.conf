server {
    listen 80;
    server_name _;
    client_max_body_size 100M;
    charset utf-8;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # 1. Landing Page Pública (zendroxtech_e_commerce_store.html)
    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    # 2. Panel Administrativo PWA (React Build)
    location /admin {
        alias /usr/share/nginx/html/admin;
        try_files $uri $uri/ /admin/index.html;
    }

    # 3. Archivos Multimedia Subidos (Fotos y Videos de Laptops)
    location /uploads/laptops/ {
        alias /uploads/laptops/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 4. Proxy hacia Backend FastAPI + Swagger Docs
    location ~ ^/(api|docs|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
